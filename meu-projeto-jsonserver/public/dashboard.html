<!DOCTYPE html>
<html lang="PT-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - EarthFirst</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<header id="Header" class="sticky-top bg-white border-bottom shadow-sm">
    <div class="container-fluid" id="topo">
        <nav class="navbar py-2">
            <button class="navbar-toggler border-0 shadow-none me-2" type="button" data-bs-toggle="offcanvas" data-bs-target="#menuLateral" aria-controls="menuLateral">
                <i class="fa-solid fa-bars fs-2" style="color: rgb(46, 139, 87);"></i>
            </button>
            <a href="index.html" class="navbar-brand d-flex align-items-center me-auto" id="logo-link">
                <img src="assets/img/logo.png" alt="Logo EarthFirst" id="logo-img" style="height: 40px; margin-right: 10px;">
                <span id="logo-texto" class="fw-bold fs-4 text-dark">EarthFirst</span>
            </a>
        </nav>
    </div>
</header>

<div class="offcanvas offcanvas-start" tabindex="-1" id="menuLateral" aria-labelledby="menuLateralLabel">
    <div class="d-flex align-items-center p-3 border-bottom">
        <img src="assets/img/logo.png" alt="EarthFirst Logo" id="menu-logo-img">
        <span id="menu-logo-text">EarthFirst</span>
    </div>
    <div class="offcanvas-body p-0">
        <div class="d-flex flex-column align-items-start w-100" id="menu-layout-novo">
            <a href="index.html" class="text-black py-3 px-4 text-decoration-none fs-5 nav-item-custom w-100 border-bottom">Início</a>
            <a href="index.html#Cadastro_ONG" class="text-black py-3 px-4 text-decoration-none fs-5 nav-item-custom w-100 border-bottom">Junte-se a Nós</a>
            <a href="index.html#Entre_em_Contato" class="text-black py-3 px-4 text-decoration-none fs-5 nav-item-custom w-100 border-bottom">Entre em Contato</a>
        </div>
    </div>
</div>

<main class="container-fluid px-md-5 my-5">
    <div class="container">
        <h2 class="mb-5 text-center">Métricas e Impacto EarthFirst</h2>
        
        <div class="row g-5">
            <div class="col-lg-12">
                <div class="card shadow border-0 rounded-4 p-4 h-100">
                    <h4 class="text-center mb-4" style="color: #28a745;">Projetos por Categoria</h4>
                    <div style="position: relative; height: 350px; width: 100%;">
                        <canvas id="graficoCategorias"></canvas>
                    </div>
                </div>
            </div>

            <div class="col-lg-12">
                <div class="card shadow border-0 rounded-4 p-4 h-100">
                    <h4 class="text-center mb-4" style="color: #28a745;">Voluntários por Projeto</h4>
                    <div style="position: relative; height: 350px; width: 100%;">
                        <canvas id="graficoVoluntarios"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="text-end mt-5">
        <a href="index.html" class="btn-voltar"> Voltar</a>
    </div>
</main>

<footer class="text-center p-4 mt-5">
    <p class="text-white mb-0">Desenvolvido por: <strong>Nícolas De Almeida</strong></p>
    <p class="text-white-50 small">Trabalho Prático 2-DIW</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/scripts/dashboard.js"></script>
<script src="assets/scripts/usuario_logado.js"></script>
</body>
</html>
