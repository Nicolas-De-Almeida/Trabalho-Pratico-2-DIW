<!DOCTYPE html>
<html lang="PT-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - EarthFirst</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<header id="Header" class="sticky-top">
    <nav class="navbar navbar-dark bg-transparent px-md-5 shadow-sm" id="topo">        <div class="container-fluid p-0 d-flex justify-content-between align-items-center">
            <a href="index.html" id="logo-link" class="d-flex align-items-center m-0 text-decoration-none">
                <img src="img/logo.png" alt="EarthFirst Logo" id="logo-img">
                <span id="logo-texto" class="ms-2">EarthFirst</span>
            </a>
            
            <button class="btn text-white p-2 border-0" type="button" data-bs-toggle="collapse" data-bs-target="#menuHamburguer" aria-controls="menuHamburguer" aria-expanded="false">
                <i class="fas fa-bars fs-2"></i>
            </button>
        </div>
        
        <div class="collapse w-100" id="menuHamburguer">
            <div class="d-flex flex-column align-items-center py-3 w-100" id="menu-layout-novo"> 
                <a href="index.html#Sobre_Nossa_Missão" class="text-black py-2 text-decoration-none fs-5 nav-item-custom">HomePage</a>               
                <a href="index.html#Sobre_Nossa_Missão" class="text-black py-2 text-decoration-none fs-5 nav-item-custom">Sobre Nossa Missão</a>
                <a href="index.html#Nossos_Projetos" class="text-black py-2 text-decoration-none fs-5 nav-item-custom">Nossos Projetos</a>
                <a href="index.html#Cadastro_ONG" class="text-black py-2 text-decoration-none fs-5 nav-item-custom">Junte-se a Nós</a>
                <a href="index.html#Entre_em_Contato" class="text-black py-2 text-decoration-none fs-5 nav-item-custom">Entre em Contato</a>
            </div>
        </div>
    </nav>
</header>

<main class="container-fluid px-md-5 my-5">
    <div class="container">
        <h2 class="mb-5 text-center">Métricas e Impacto EarthFirst 📊</h2>
        
        <div class="row g-5">
            <div class="col-lg-12">
                <div class="card shadow border-0 rounded-4 p-4 h-100">
                    <h4 class="text-center mb-4" style="color: #28a745;">Projetos por Categoria</h4>
                    <div style="position: relative; height: 350px; width: 100%;">
                        <canvas id="graficoCategorias"></canvas>
                    </div>
                </div>
            </div>

            <div class="col-lg-12">
                <div class="card shadow border-0 rounded-4 p-4 h-100">
                    <h4 class="text-center mb-4" style="color: #28a745;">Voluntários por Projeto</h4>
                    <div style="position: relative; height: 350px; width: 100%;">
                        <canvas id="graficoVoluntarios"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="text-end mt-5">
        <a href="index.html" class="btn-voltar"> Voltar</a>
    </div>
</main>

<footer class="text-center p-4 mt-5">
    <div class="siga-nos-container text-center py-4">
        <h3 class="text-white mb-4">Siga-nos nas Redes Sociais</h3>
        <div class="redes-sociais-icones">
            <a href="#" target="_blank" class="icone-social instagram"><i class="fab fa-instagram"></i></a>
            <a href="#" target="_blank" class="icone-social linkedin"><i class="fab fa-linkedin-in"></i></a>
            <a href="#" target="_blank" class="icone-social youtube"><i class="fab fa-youtube"></i></a>
            <a href="#" target="_blank" class="icone-social facebook"><i class="fab fa-facebook-f"></i></a>
        </div>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="dashboard.js"></script>
</body>
</html>
