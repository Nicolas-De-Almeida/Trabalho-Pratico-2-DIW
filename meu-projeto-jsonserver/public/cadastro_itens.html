<!DOCTYPE html>
<html lang="PT-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Projetos - EarthFirst</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body style="background: rgb(248, 249, 250);">

<header id="Header" class="sticky-top">
    <div class="container-fluid" id="topo">
        <a href="index.html" id="logo-link">
            <img src="assets/img/logo.png" alt="Logo EarthFirst" id="logo-img">
            <span id="logo-texto">EarthFirst</span>
        </a>
        <nav id="navegacao">
            <div id="menu-layout-novo"></div>
        </nav>
    </div>
</header>

<main class="container py-5">
    <div class="bg-white p-5 shadow-sm rounded-4 border">
        <h2 class="text-center text-dark mb-5 text-decoration-none" style="font-size: 40px; font-weight: bold;">Cadastro de Projetos (CRUD)</h2>
        
        <form id="crudForm">
            <div class="row mb-4">
                <div class="col-md-3">
                    <label class="fw-bold mb-2 text-dark fs-5">Id</label>
                    <input type="text" id="inputId" class="form-control form-control-lg bg-light" placeholder="ID automático" readonly>
                </div>
                <div class="col-md-9">
                    <label class="fw-bold mb-2 text-dark fs-5">Título (*)</label>
                    <input type="text" id="inputTitulo" class="form-control form-control-lg" placeholder="Informe o título do projeto" required>
                </div>
            </div>

            <div class="row mb-4">
                <div class="col-md-6">
                    <label class="fw-bold mb-2 text-dark fs-5">Categoria (*)</label>
                    <input type="text" id="inputCategoria" class="form-control form-control-lg" placeholder="Informe a categoria" required>
                </div>
                <div class="col-md-6">
                    <label class="fw-bold mb-2 text-dark fs-5">Voluntários</label>
                    <input type="number" id="inputVoluntarios" class="form-control form-control-lg" placeholder="Qtd. Voluntários">
                </div>
            </div>

            <div class="row mb-4">
                <div class="col-12">
                    <label class="fw-bold mb-2 text-dark fs-5">URL da Imagem</label>
                    <input type="text" id="inputImagem" class="form-control form-control-lg" placeholder="Link da imagem da capa">
                </div>
            </div>

            <p class="text-muted fs-6 mb-4">(*) Campos obrigatórios</p>

            <div class="d-flex flex-wrap gap-2 mb-5">
                <button type="button" id="btnInserir" class="btn btn-success px-4 py-2 fs-5 fw-bold text-white border-0" style="border-radius: 8px; background-color: #28a745;">Inserir</button>
                <button type="button" id="btnAlterar" class="btn btn-warning px-4 py-2 fs-5 fw-bold text-dark border-0" style="border-radius: 8px; background-color: #ffc107;">Alterar</button>
                <button type="button" id="btnExcluir" class="btn btn-danger px-4 py-2 fs-5 fw-bold text-white border-0" style="border-radius: 8px; background-color: #dc3545;">Excluir</button>
                <button type="button" id="btnLimpar" class="btn btn-secondary px-4 py-2 fs-5 fw-bold text-white border-0" style="border-radius: 8px; background-color: #6c757d;">Limpar Form</button>
            </div>
        </form>

        <div class="table-responsive">
            <table class="table table-hover border align-middle text-center fs-5">
                <thead class="table-light">
                    <tr>
                        <th class="py-3">#</th>
                        <th class="py-3 text-start">Título</th>
                        <th class="py-3">Categoria</th>
                        <th class="py-3">Voluntários</th>
                    </tr>
                </thead>
                <tbody id="tabelaItens"></tbody>
            </table>
        </div>
    </div>
</main>

<script src="assets/scripts/cadastro_itens.js"></script>
<script src="assets/scripts/usuario_logado.js"></script>

</body>
</html>
